name: Windows native development checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Python test dependencies
        run: python -m pip install lupa jsonschema
      - name: Build DLL and run native, Java and Python checks
        run: python -X utf8 tools/check_development.py --out evidence/windows-ci
      - name: Assemble development package
        run: python -X utf8 tools/package_release.py --platform windows --out evidence/packages/dst-mc-windows-development.zip
      - name: Preserve build evidence and development package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-development-${{ github.sha }}
          path: |
            evidence/windows-ci/
            evidence/packages/
          if-no-files-found: warn
